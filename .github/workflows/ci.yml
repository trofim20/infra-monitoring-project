name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check bash syntax
        run: |
          bash -n check_api.sh
          bash -n analyze_logs.sh

      - name: Run ShellCheck
        run: shellcheck check_api.sh analyze_logs.sh

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  test-scripts:
    name: test-scripts
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: check_api.sh returns 0 for a working API
        run: |
          # httpbin.org sometimes answers 502/503, so try a few times
          for attempt in 1 2 3; do
            if ./check_api.sh https://httpbin.org/status/200; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 5 seconds"
            sleep 5
          done
          exit 1

      - name: check_api.sh returns 1 on errors
        run: |
          must_fail() {
            if ./check_api.sh "$@"; then
              echo "Expected exit code 1 for: $*"
              exit 1
            fi
          }
          must_fail https://httpbin.org/status/404
          must_fail http://127.0.0.1:9
          must_fail not-a-url
          must_fail

      - name: analyze_logs.sh generates and analyzes the log
        run: |
          ./analyze_logs.sh | tee report.txt
          test "$(wc -l < access.log)" -ge 300
          grep -q "Общее количество запросов: 500" report.txt
          if ./analyze_logs.sh -n 100; then
            echo "Expected an error for less than 300 lines"
            exit 1
          fi

  test-compose:
    name: test-compose
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Start the stack
        run: docker compose up -d --wait

      - name: Request through the proxy
        run: |
          docker compose ps
          curl -s http://localhost:80 | tee response.txt
          grep -q "Monitoring Service Active" response.txt
          ./check_api.sh http://localhost:80

      - name: api is not published on the host
        run: |
          if curl -s --max-time 3 http://localhost:8080; then
            echo "Port 8080 must not be reachable from the host"
            exit 1
          fi

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down
